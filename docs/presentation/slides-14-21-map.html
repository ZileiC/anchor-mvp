<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides 14–21 · feasibility map</title>
<style>
  :root {
    /* Paper and ink: the material the product itself uses. Jade carries the
       structure, ochre is spent only on what can bite. */
    --paper: #F2EFE4;
    --raised: #FAF8F0;
    --ink: #17211B;
    --ink-soft: #3D4A41;
    --ink-muted: #6B7268;
    --hairline: rgba(23, 33, 27, 0.12);
    --hairline-strong: rgba(23, 33, 27, 0.24);
    --jade: #1F5C46;
    --jade-deep: #16432F;
    --ochre: #9C6B1F;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }

  body {
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 13px 24px 11px;
    border-bottom: 1px solid var(--hairline);
    background: var(--paper);
  }

  .bar h1 { font-size: 14.5px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .bar .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }
  .bar .zoom { margin-left: auto; display: flex; gap: 6px; }

  .bar button {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--raised);
    border: 1px solid var(--hairline-strong);
    border-radius: 4px;
    padding: 4px 9px;
    cursor: pointer;
  }

  .bar button:hover { color: var(--jade-deep); border-color: var(--jade); }
  .bar button:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

  .viewport { overflow: auto; padding: 22px 24px 36px; }
  .canvas { position: relative; transform-origin: top left; margin: 0 auto; }
  svg.wires { position: absolute; left: 0; top: 0; overflow: visible; }
  .node { position: absolute; }

  /* root */
  .root {
    background: var(--jade-deep);
    border-radius: 12px;
    color: var(--raised);
    padding: 16px 22px;
    text-align: center;
  }

  .root .k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    opacity: 0.7;
    margin: 0 0 6px;
  }

  .root h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 6px; }
  .root p { margin: 0; font-size: 11.5px; line-height: 1.55; opacity: 0.86; }

  /* phase label, sits in the left margin at a group boundary */
  .phase {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--jade-deep);
    white-space: nowrap;
  }

  .phase b { font-family: var(--sans); font-size: 11.5px; letter-spacing: 0; font-weight: 600; }
  .phase .bridge { color: var(--ink-muted); }

  /* the slide: head of one branch */
  .slide {
    background: var(--raised);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 11px 14px;
    width: 430px;
  }

  .slide .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }

  .slide .num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--raised);
    background: var(--jade);
    border-radius: 3px;
    padding: 1px 5px;
  }

  .slide .time {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .slide h4 { font-size: 13.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }

  /* one reasoning step: a sub-branch hanging below the slide */
  .step {
    width: 290px;
    height: 74px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 9px 11px;
  }

  .step .rel {
    display: block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }

  .step p { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--ink-soft); }

  .step.limit { border-color: rgba(156, 107, 31, 0.4); }
  .step.limit .rel { color: var(--ochre); }
  .step.limit p { color: var(--ochre); }

  /* legend + handover */
  .legend { border: 1px dashed var(--hairline-strong); border-radius: 10px; padding: 12px 14px; width: 560px; }

  .legend .row {
    display: grid;
    grid-template-columns: 44px 1fr;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .legend .row:last-child { margin-bottom: 0; }
  .legend .swatch { width: 44px; height: 10px; position: relative; }

  .legend .swatch::before {
    content: "";
    position: absolute;
    left: 0; right: 4px; top: 4px;
    border-top: 1.5px solid var(--jade);
  }

  .legend .swatch.branch::before { border-top: 1.2px solid rgba(31, 92, 70, 0.55); }
  .legend .swatch.limit::before { border-top: 1.5px dashed var(--ochre); }
  .legend .swatch.plain::before { border-top: 1px solid var(--hairline-strong); }

  .handover { font-family: var(--mono); font-size: 11px; color: var(--jade); margin: 0; text-align: right; }

  @media print {
    @page { size: A2 portrait; margin: 6mm; }
    .bar { display: none; }
    .viewport { overflow: visible; padding: 0; }
    .canvas { transform: none !important; }
    .slide, .step, .legend, .root { break-inside: avoid; }
  }

  @media (max-width: 820px) {
    .bar .sub { display: none; }
    .viewport { padding: 12px; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Feasibility · slides 14–21</h1>
  <span class="sub">one page · the root at the top · every branch descends · soft curves</span>
  <div class="zoom">
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <button type="button" id="zoom-fit">Fit</button>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
  </div>
</div>

<div class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg class="wires" id="wires" aria-hidden="true">
      <defs>
        <marker id="jade-arrow" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#1F5C46"></path>
        </marker>
        <marker id="branch-arrow" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="rgba(31,92,70,0.75)"></path>
        </marker>
        <marker id="ochre-arrow" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#9C6B1F"></path>
        </marker>
        <marker id="ink-arrow" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#3D4A41"></path>
        </marker>
      </defs>
    </svg>
    <div id="nodes"></div>
  </div>
</div>

<script>
  /* ------------------------------------------------------------------ content */
  const CONTENT = {
    root: {
      kicker: 'Feasibility assessment',
      title: 'Does it hold?',
      line: 'How it runs → what we proved → what it needs → where it stops',
    },
    phases: [
      {
        tag: '① mechanism', range: '14–15', title: 'How it runs', bridge: 'so it can be tested',
        slides: [
          {
            no: '14', time: '45s', title: 'Windows host and Android client',
            steps: [
              { rel: 'runs on', text: 'One laptop: Flutter senior UI + FastAPI + SQLite' },
              { rel: 'who', text: 'The phone is a client — it pulls the report, never opens a mic' },
              { rel: 'link', text: 'One LAN: HTTP/TCP 8077, discovery on UDP 8078' },
              { rel: 'price', text: 'The host must stay on; a scheduled digest needs a worker', kind: 'limit' },
            ],
          },
          {
            no: '15', time: '60s', title: 'Speech, captions and fallback',
            steps: [
              { rel: 'stages', text: 'Recognise → reply → speak → recover' },
              { rel: 'shortcut', text: 'Typing bypasses capture entirely' },
              { rel: 'priority', text: 'DeepSeek first, Edge as fallback, device voice last' },
              { rel: 'so', text: 'Captions stay, Stop always works, retry is one tap', kind: 'limit' },
            ],
          },
        ],
      },
      {
        tag: '② evidence', range: '16–17', title: 'What we proved', bridge: 'but evidence has a boundary',
        slides: [
          {
            no: '16', time: '60s', title: 'What the backend smoke checked',
            steps: [
              { rel: 'method', text: '8 groups on a real local socket, temporary DB, synthetic data' },
              { rel: 'roles', text: 'A caregiver cannot change consent → 403' },
              { rel: 'report', text: 'Draft 403 → approved readable → revoked filtered' },
              { rel: 'failure', text: 'Provider outage 503 → typed retry succeeds' },
            ],
          },
          {
            no: '17', time: '45s', title: 'Backend smoke passed on both platforms',
            steps: [
              { rel: 'repeat', text: 'Same script: macOS 8/8, Windows 8/8' },
              { rel: 'coverage', text: 'Suites: 442 backend, 319 Flutter, run on macOS' },
              { rel: 'method', text: 'Local HTTP, synthetic records, test adapters' },
              { rel: 'limit', text: 'Not proven: real mic, real speaker, real phone', kind: 'limit' },
            ],
          },
        ],
      },
      {
        tag: '③ operations', range: '18–19', title: 'What it needs', bridge: 'and it costs very little',
        slides: [
          {
            no: '18', time: '40s', title: 'What a classroom pilot needs',
            steps: [
              { rel: 'host', text: 'One reachable laptop; network rehearsed' },
              { rel: 'fallback', text: 'Synthetic speech, typing, a prepared walkthrough' },
              { rel: 'operator', text: 'Someone seeds last week and checks the first report' },
              { rel: 'owner', text: 'Ongoing use needs an owner for the scheduled worker' },
            ],
          },
          {
            no: '19', time: '35s', title: 'Illustrative monthly API cost',
            steps: [
              { rel: 'usage', text: '10 cloud turns a day, 30 days' },
              { rel: 'per turn', text: '1,000 in / 100 out tokens, 50 characters of speech' },
              { rel: 'subtotal', text: '≈ US$1.48 per household-month' },
              { rel: 'excludes', text: 'Power, connectivity, storage, support, retries — not a bill', kind: 'limit' },
            ],
          },
        ],
      },
      {
        tag: '④ boundary', range: '20–21', title: 'Where it stops', bridge: 'so we gate the demo',
        slides: [
          {
            no: '20', time: '30s', title: 'Release and privacy limits',
            steps: [
              { rel: 'risk', text: 'Packaging can embed a credential file — inspect first', kind: 'limit' },
              { rel: 'gap', text: 'Direct speech endpoints lack a server-side consent check', kind: 'limit' },
              { rel: 'scope', text: 'Demo identities, plain LAN HTTP, synthetic records only' },
              { rel: 'status', text: 'Both open items are pull requests, not anecdotes' },
            ],
          },
          {
            no: '21', time: '35s', title: 'Readiness for a live demo',
            steps: [
              { rel: 'link', text: 'Discovery and manual pairing, on the real hotspot' },
              { rel: 'voice', text: 'Real mic, captions, playback, typed fallback practised' },
              { rel: 'report', text: 'Preview → approve → refresh after revoking one topic' },
              { rel: 'backup', text: 'An English walkthrough ready to switch to' },
            ],
          },
        ],
      },
    ],
  };

  /* ----------------------------------------------------------------- geometry */
  const W = 1700;                 // page width
  const RAIL_X = 96;              // vertical spine, left margin
  const SLIDE_W = 430;
  const SLIDE_X = (W - SLIDE_W) / 2;   // slides centred
  const STEP_W = 290;
  const STEP_H = 74;
  const STEP_GAP = 20;
  const STEP_TOTAL = 4 * STEP_W + 3 * STEP_GAP;   // 1220
  const STEP_X0 = (W - STEP_TOTAL) / 2;           // 210
  const ROOT_W = 470;
  const ROOT_H = 118;
  const ROOT_Y = 26;
  const BAND_TOP0 = ROOT_Y + ROOT_H + 64;

  const canvas = document.getElementById('canvas');
  const nodes = document.getElementById('nodes');
  const wires = document.getElementById('wires');

  const slideBoxes = [];
  const stepBoxes = [];
  const phaseMarks = [];

  let y = BAND_TOP0;
  const BAND_GAP = 46;

  CONTENT.phases.forEach((phase, pi) => {
    phaseMarks.push({ phase, y: y - 58 });
    phase.slides.forEach((slide) => {
      const slideTop = y;
      const slideH = 86;
      const stepsTop = slideTop + slideH + 54;
      slideBoxes.push({ slide, top: slideTop, h: slideH, phase: pi });
      slide.steps.forEach((step, k) => {
        stepBoxes.push({
          step, index: k,
          x: STEP_X0 + k * (STEP_W + STEP_GAP),
          top: stepsTop,
          w: STEP_W, h: STEP_H,
          slideTop, slideH,
        });
      });
      y = stepsTop + STEP_H + BAND_GAP;
    });
  });

  const contentBottom = y;
  const LEGEND_Y = contentBottom + 10;
  const H = LEGEND_Y + 96;

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  wires.setAttribute('viewBox', `0 0 ${W} ${H}`);
  wires.setAttribute('width', W);
  wires.setAttribute('height', H);

  const svg = (tag, attrs, text) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    if (text !== undefined) el.textContent = text;
    return el;
  };

  /* -------------------------------------------------------------------- root */
  const root = document.createElement('div');
  root.className = 'node root';
  root.style.cssText = `left:${(W - ROOT_W) / 2}px; top:${ROOT_Y}px; width:${ROOT_W}px; height:${ROOT_H}px;`;
  root.innerHTML = `
    <p class="k">${CONTENT.root.kicker}</p>
    <h2>${CONTENT.root.title}</h2>
    <p>${CONTENT.root.line}</p>`;
  nodes.appendChild(root);

  /* --------------------------------------------------------------- the spine
     One soft curve from the root down to the first slide, then one soft S-curve
     between consecutive slides. Never a straight line, never an elbow. */
  const rootBottom = ROOT_Y + ROOT_H;
  const first = slideBoxes[0];
  wires.appendChild(svg('path', {
    d: `M${W / 2} ${rootBottom} C ${W / 2 - 46} ${rootBottom + 34}, ${SLIDE_X + SLIDE_W / 2 + 46} ${first.top - 34}, ${SLIDE_X + SLIDE_W / 2} ${first.top - 1}`,
    fill: 'none', stroke: '#1F5C46', 'stroke-width': '1.6',
    'marker-end': 'url(#jade-arrow)',
  }));

  slideBoxes.forEach((box, i) => {
    if (i === slideBoxes.length - 1) return;
    const next = slideBoxes[i + 1];
    const y1 = box.top + box.h + 2;
    const y2 = next.top - 2;
    const mid = (y1 + y2) / 2;
    const d = `M${SLIDE_X + 26} ${y1} C ${SLIDE_X + 26} ${mid}, ${SLIDE_X + 26} ${mid}, ${SLIDE_X + 26} ${y2}`;
    wires.appendChild(svg('path', {
      d, fill: 'none', stroke: '#1F5C46', 'stroke-width': '1.6',
      'marker-end': 'url(#jade-arrow)',
    }));
    wires.appendChild(svg('text', {
      x: SLIDE_X - 12, y: mid + 3, 'text-anchor': 'end',
      'font-family': 'ui-monospace, Consolas, monospace', 'font-size': '9', fill: '#6B7268',
    }, 'then'));
  });

  /* ----------------------------------------------------------- phase labels */
  phaseMarks.forEach(({ phase, y: markY }) => {
    const el = document.createElement('div');
    el.className = 'node phase';
    el.style.cssText = `left:0; top:${markY}px; width:${W - 420}px; text-align:left;`;
    el.innerHTML = `${phase.tag} · ${phase.range}&nbsp;&nbsp;<b>${phase.title}</b>`
      + `<span class="bridge"> — ${phase.bridge}</span>`;
    nodes.appendChild(el);

    const rule = svg('path', {
      d: `M0 ${markY + 24} H${W - 40}`,
      fill: 'none', stroke: 'rgba(23,33,27,0.16)', 'stroke-width': '1',
    });
    wires.appendChild(rule);
  });

  /* -------------------------------------------------------------- slide cards */
  slideBoxes.forEach((box) => {
    const el = document.createElement('div');
    el.className = 'node slide';
    el.style.cssText = `left:${SLIDE_X}px; top:${box.top}px; height:${box.h}px;`;
    el.innerHTML = `
      <div class="row"><span class="num">${box.slide.no}</span><span class="time">${box.slide.time}</span></div>
      <h4>${box.slide.title}</h4>`;
    nodes.appendChild(el);
  });

  /* ------------------------------------------------ fan: slide → its 4 steps */
  stepBoxes.forEach((box) => {
    const sx = SLIDE_X + SLIDE_W * (0.2 + 0.2 * box.index);
    const sy = box.slideTop + box.slideH;
    const tx = box.x + STEP_W / 2;
    const ty = box.top - 1;
    const drop = ty - sy;
    const d = `M${sx} ${sy} C ${sx} ${sy + drop * 0.52}, ${tx} ${ty - drop * 0.52}, ${tx} ${ty}`;
    const isLimit = box.step.kind === 'limit';
    wires.appendChild(svg('path', {
      d, fill: 'none',
      stroke: isLimit ? 'rgba(156,107,31,0.6)' : 'rgba(31,92,70,0.55)',
      'stroke-width': '1.2',
      'marker-end': isLimit ? 'url(#ink-arrow)' : 'url(#branch-arrow)',
    }));

    const el = document.createElement('div');
    el.className = 'node step' + (isLimit ? ' limit' : '');
    el.style.cssText = `left:${box.x}px; top:${box.top}px;`;
    el.innerHTML = `<span class="rel">${box.step.rel}</span><p>${box.step.text}</p>`;
    nodes.appendChild(el);
  });

  /* --------------------------------------- limit: 17 narrows 20, on the right */
  const from17 = slideBoxes.find((b) => b.slide.no === '17');
  const to20 = slideBoxes.find((b) => b.slide.no === '20');
  const railX = W - 66;
  const startY = from17.top + from17.h / 2;
  const endY = to20.top + to20.h / 2;
  wires.appendChild(svg('path', {
    d: `M${SLIDE_X + SLIDE_W} ${startY} C ${railX} ${startY + 60}, ${railX} ${endY - 60}, ${SLIDE_X + SLIDE_W} ${endY}`,
    fill: 'none', stroke: '#9C6B1F', 'stroke-width': '1.4', 'stroke-dasharray': '6 5',
    'marker-end': 'url(#ink-arrow)',
  }));
  wires.appendChild(svg('text', {
    x: W - 40, y: (from17.top + to20.top) / 2,
    transform: `rotate(-90 ${W - 40} ${(from17.top + to20.top) / 2})`,
    'text-anchor': 'middle',
    'font-family': 'ui-monospace, Consolas, monospace',
    'font-size': '9.5', fill: '#9C6B1F',
  }, 'limit — the evidence of 17 stops here'));

  /* ------------------------------------------------------------------ legend */
  const legend = document.createElement('div');
  legend.className = 'node legend';
  legend.style.cssText = `left:${SLIDE_X}px; top:${LEGEND_Y}px;`;
  legend.innerHTML = `
    <div class="row"><span class="swatch"></span><span>Progression — the spine: one slide leads to the next</span></div>
    <div class="row"><span class="swatch branch"></span><span>Branch — a step of that slide's reasoning, labelled with its role</span></div>
    <div class="row"><span class="swatch limit"></span><span>Limit — a later slide narrows an earlier claim</span></div>`;
  nodes.appendChild(legend);

  const handover = document.createElement('div');
  handover.className = 'node';
  handover.style.cssText = `left:${W - 40 - 240}px; top:${LEGEND_Y + 12}px; width:240px;`;
  handover.innerHTML = '<p class="handover">slide 22 → live demo</p>';
  nodes.appendChild(handover);

  /* -------------------------------------------------------------------- zoom */
  (function () {
    const viewport = document.getElementById('viewport');
    let scale = 1;

    function apply() {
      canvas.style.transform = `scale(${scale})`;
      canvas.style.height = H * scale + 'px';
    }

    function fit() {
      scale = Math.min(1, (viewport.clientWidth - 8) / W);
      apply();
    }

    document.getElementById('zoom-fit').addEventListener('click', fit);
    document.getElementById('zoom-in').addEventListener('click', () => {
      scale = Math.min(1.6, scale + 0.1);
      apply();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      scale = Math.max(0.22, scale - 0.1);
      apply();
    });
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
