<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides 14–21 · feasibility map</title>
<style>
  :root {
    /* Paper and ink: the material the product itself uses. Jade carries structure,
       ochre is spent only on what can bite — a limit, a gap, a cost. */
    --paper: #F2EFE4;
    --raised: #FAF8F0;
    --ink: #17211B;
    --ink-soft: #3D4A41;
    --ink-muted: #6B7268;
    --hairline: rgba(23, 33, 27, 0.12);
    --hairline-strong: rgba(23, 33, 27, 0.26);
    --jade: #1F5C46;
    --jade-deep: #16432F;
    --ochre: #9C6B1F;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }

  body {
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 13px 24px 11px;
    border-bottom: 1px solid var(--hairline);
    background: var(--paper);
  }

  .bar h1 { font-size: 14.5px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .bar .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }
  .bar .zoom { margin-left: auto; display: flex; gap: 6px; }

  .bar button {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--raised);
    border: 1px solid var(--hairline-strong);
    border-radius: 4px;
    padding: 4px 9px;
    cursor: pointer;
  }

  .bar button:hover { color: var(--jade-deep); border-color: var(--jade); }
  .bar button:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

  .viewport { overflow: auto; padding: 22px 24px 36px; }

  .canvas { position: relative; transform-origin: top left; margin: 0 auto; }
  svg.wires { position: absolute; left: 0; top: 0; overflow: visible; }
  .node { position: absolute; }

  /* root */
  .root {
    background: var(--jade-deep);
    border-radius: 10px;
    color: var(--raised);
    padding: 16px 20px;
  }

  .root .k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    opacity: 0.7;
    margin: 0 0 6px;
  }

  .root h2 { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 7px; }
  .root p { margin: 0; font-size: 11.5px; line-height: 1.55; opacity: 0.86; }

  /* phase band */
  .band {
    border-top: 1px solid var(--hairline-strong);
    padding-top: 9px;
  }

  .band .left {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .band .left span {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--jade);
    margin-right: 8px;
  }

  .band .bridge {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--ink-muted);
    text-align: right;
  }

  /* slide on the spine */
  .slide {
    background: var(--raised);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 11px 13px;
  }

  .slide .row { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; }

  .slide .num {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--raised);
    background: var(--jade);
    border-radius: 3px;
    padding: 1px 5px;
  }

  .slide .time {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .slide h4 {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.005em;
    margin: 0 0 6px;
  }

  .slide p {
    margin: 0;
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--ink-muted);
  }

  /* leaf: one reasoning step of that slide */
  .leaf {
    display: grid;
    grid-template-columns: 92px 1fr;
    align-items: baseline;
    gap: 0;
    padding-left: 11px;
    border-left: 2px solid var(--hairline-strong);
  }

  .leaf .rel {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .leaf p { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--ink-soft); }
  .leaf p b { color: var(--ink); font-weight: 600; }

  .leaf.limit { border-left-color: var(--ochre); }
  .leaf.limit .rel { color: var(--ochre); }
  .leaf.limit p { color: var(--ochre); }

  /* legend + handover */
  .legend { border: 1px dashed var(--hairline-strong); border-radius: 9px; padding: 12px 14px; }

  .legend .row {
    display: grid;
    grid-template-columns: 44px 1fr;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .legend .row:last-child { margin-bottom: 0; }
  .legend .swatch { width: 44px; height: 8px; position: relative; }

  .legend .swatch::before {
    content: "";
    position: absolute;
    left: 0; right: 6px; top: 3px;
    border-top: 1.5px solid var(--jade);
  }

  .legend .swatch::after {
    content: "";
    position: absolute;
    right: 0; top: 0;
    border-left: 6px solid var(--jade);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
  }

  .legend .swatch.plain::before { border-top: 1px solid var(--hairline-strong); }
  .legend .swatch.plain::after { display: none; }

  .legend .swatch.limit::before { border-top: 1.5px dashed var(--ochre); }
  .legend .swatch.limit::after { border-left-color: var(--ochre); }

  .handover { font-family: var(--mono); font-size: 11px; color: var(--jade); margin: 0; text-align: right; }

  @media print {
    @page { size: A2 landscape; margin: 6mm; }
    .bar { display: none; }
    .viewport { overflow: visible; padding: 0; }
    .canvas { transform: none !important; }
    .slide, .leaf, .band, .root, .legend { break-inside: avoid; }
  }

  @media (max-width: 820px) {
    .bar .sub { display: none; }
    .viewport { padding: 12px; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Feasibility · slides 14–21</h1>
  <span class="sub">one page · eight branches down the spine · each branch is that slide's own reasoning</span>
  <div class="zoom">
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <button type="button" id="zoom-fit">Fit</button>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
  </div>
</div>

<div class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg class="wires" id="wires" aria-hidden="true">
      <defs>
        <marker id="jade-arrow" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#1F5C46"></path>
        </marker>
        <marker id="ink-arrow" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="7.5" markerHeight="7.5" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#3D4A41"></path>
        </marker>
      </defs>
    </svg>
    <div id="nodes"></div>
  </div>
</div>

<script>
  /* ------------------------------------------------------------------ content
     Eight slides, four reasoning steps each. Each step is a branch of that slide,
     and its label says what the step does in the argument. */
  const CONTENT = {
    root: {
      kicker: 'Feasibility assessment',
      title: 'Does it hold?',
      line: 'One host. One pipeline. One repeatable check. Then the boundaries.',
    },
    phases: [
      {
        tag: '① mechanism', range: '14–15', title: 'How it runs',
        bridge: 'so it can be tested',
        slides: [
          {
            no: '14', time: '45s', title: 'Windows host and Android client',
            note: 'One laptop is the product; the phone reads, never listens.',
            steps: [
              { rel: 'runs on', text: 'Flutter senior UI + FastAPI + SQLite on one Windows laptop' },
              { rel: 'who', text: 'The phone is a client — it pulls the report and never opens a mic' },
              { rel: 'link', text: 'One LAN: HTTP on TCP 8077, discovery on UDP 8078' },
              { rel: 'price', text: 'The host must stay on; a scheduled digest needs a worker', kind: 'limit' },
            ],
          },
          {
            no: '15', time: '60s', title: 'Speech, captions and fallback',
            note: 'Every stage names its fallback before it is needed.',
            steps: [
              { rel: 'stages', text: 'Recognise → reply → speak → recover' },
              { rel: 'shortcut', text: 'Typing bypasses capture entirely; no microphone required' },
              { rel: 'priority', text: 'DeepSeek first, Edge as fallback, device voice last' },
              { rel: 'so', text: 'Captions stay, Stop always works, retry is one tap', kind: 'limit' },
            ],
          },
        ],
      },
      {
        tag: '② evidence', range: '16–17', title: 'What we proved',
        bridge: 'but evidence has a boundary',
        slides: [
          {
            no: '16', time: '60s', title: 'What the backend smoke checked',
            note: 'Four failure modes, each with an observable status code.',
            steps: [
              { rel: 'method', text: '8 groups against a real local socket, a temporary database and synthetic data' },
              { rel: 'roles', text: 'A caregiver cannot change the senior’s consent → 403' },
              { rel: 'report', text: 'Draft 403 → approved report readable → revoked topics filtered' },
              { rel: 'failure', text: 'Provider outage returns 503, then a typed retry succeeds' },
            ],
          },
          {
            no: '17', time: '45s', title: 'Backend smoke passed on both platforms',
            note: 'Two machines is a claim about the code, not about one environment.',
            steps: [
              { rel: 'repeat', text: 'The same script: macOS 8/8 and Windows 8/8' },
              { rel: 'coverage', text: 'Full suites: 442 backend, 319 Flutter, both run on macOS' },
              { rel: 'method', text: 'Local HTTP, synthetic records and test adapters' },
              { rel: 'limit', text: 'Not proven: a real microphone, a real speaker, a real phone', kind: 'limit' },
            ],
          },
        ],
      },
      {
        tag: '③ operations', range: '18–19', title: 'What it needs',
        bridge: 'and it costs very little',
        slides: [
          {
            no: '18', time: '40s', title: 'What a classroom pilot needs',
            note: 'Feasibility here is organisational, not technical.',
            steps: [
              { rel: 'host', text: 'One reachable laptop; the network rehearsed beforehand' },
              { rel: 'fallback', text: 'Synthetic speech, typed input and a prepared walkthrough' },
              { rel: 'operator', text: 'Someone seeds last week and checks the first report' },
              { rel: 'owner', text: 'Ongoing use needs an owner for the scheduled worker' },
            ],
          },
          {
            no: '19', time: '35s', title: 'Illustrative monthly API cost',
            note: 'A scenario with named assumptions, not an invoice.',
            steps: [
              { rel: 'usage', text: 'Ten cloud turns a day for thirty days' },
              { rel: 'per turn', text: '1,000 input tokens, 100 output tokens, 50 characters of speech' },
              { rel: 'subtotal', text: '≈ US$1.48 per household-month' },
              { rel: 'excludes', text: 'Power, connectivity, storage, support and retries — not a bill', kind: 'limit' },
            ],
          },
        ],
      },
      {
        tag: '④ boundary', range: '20–21', title: 'Where it stops',
        bridge: 'so we gate the demo',
        slides: [
          {
            no: '20', time: '30s', title: 'Release and privacy limits',
            note: 'Naming what is unsolved is what makes the rest believable.',
            steps: [
              { rel: 'risk', text: 'Packaging can embed a credential file — inspect before shipping', kind: 'limit' },
              { rel: 'gap', text: 'Direct speech endpoints lack a server-side consent check', kind: 'limit' },
              { rel: 'scope', text: 'Demo identities, plain LAN HTTP, synthetic records only' },
              { rel: 'status', text: 'Both open items are pull requests, not anecdotes' },
            ],
          },
          {
            no: '21', time: '35s', title: 'Readiness for a live demo',
            note: 'Rehearse the failure paths; they decide whether the demo is honest.',
            steps: [
              { rel: 'link', text: 'Discovery and manual pairing, on the actual hotspot' },
              { rel: 'voice', text: 'Real microphone, captions, playback, typed fallback practised' },
              { rel: 'report', text: 'Preview → approve → refresh after revoking one topic' },
              { rel: 'backup', text: 'An English walkthrough ready to switch to' },
            ],
          },
        ],
      },
    ],
  };

  /* ------------------------------------------------------------------ geometry */
  const W = 1700;
  const BAND_W = 1532;
  const M = 44;
  const SPINE_X = 22;
  const SLIDE_X = M;
  const SLIDE_W = 330;
  const BUS_X = SLIDE_X + SLIDE_W + 22;      // 396
  const LEAF_X = 480;
  const LEAF_W = 1020;
  const LEAF_H = 30;
  const ROW_H = 170;
  const BAND_H = 48;
  const GAP = 12;
  const ROOT_Y = 24;
  const ROOT_H = 116;

  const canvas = document.getElementById('canvas');
  const nodes = document.getElementById('nodes');
  const wires = document.getElementById('wires');

  const slides = CONTENT.phases.flatMap((p) => p.slides);
  const rootsY = ROOT_Y + ROOT_H + 30;

  // cursor + recorded boxes
  let y = rootsY;
  const bands = [];
  const slideBoxes = [];
  const leafBoxes = [];

  CONTENT.phases.forEach((phase, pi) => {
    bands.push({ phase, top: y, h: BAND_H });
    y += BAND_H;
    phase.slides.forEach((slide, si) => {
      const top = y + 6;
      slideBoxes.push({ slide, top, h: ROW_H - 12, cx: SLIDE_X + SLIDE_W / 2 });
      // 2 × 2 leaves to the right of the slide node
      // one column, top to bottom: the order the slide argues them
      slide.steps.forEach((step, k) => leafBoxes.push({
        step, x: LEAF_X, y: top + 8 + k * (LEAF_H + 6), w: LEAF_W, h: LEAF_H,
      }));
      y += ROW_H;
    });
  });

  const contentBottom = y;
  const LEGEND_Y = contentBottom + 28;
  const H = LEGEND_Y + 120;

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  wires.setAttribute('viewBox', `0 0 ${W} ${H}`);
  wires.setAttribute('width', W);
  wires.setAttribute('height', H);

  const svg = (tag, attrs, text) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    if (text !== undefined) el.textContent = text;
    return el;
  };

  /* ------------------------------------------------------------------- root */
  const root = document.createElement('div');
  root.className = 'node root';
  root.style.cssText = `left:${SLIDE_X}px; top:${ROOT_Y}px; width:${SLIDE_W}px; height:${ROOT_H}px;`;
  root.innerHTML = `
    <p class="k">${CONTENT.root.kicker}</p>
    <h2>${CONTENT.root.title}</h2>
    <p>${CONTENT.root.line}</p>`;
  nodes.appendChild(root);

  // spine: root bottom → last slide
  const spineBottom = slideBoxes[slideBoxes.length - 1].top + slideBoxes[slideBoxes.length - 1].h / 2;
  wires.appendChild(svg('path', {
    d: `M${SLIDE_X + 30} ${ROOT_Y + ROOT_H} V${ROOT_Y + ROOT_H + 12} H${SPINE_X} V${spineBottom}`,
    fill: 'none', stroke: '#1F5C46', 'stroke-width': '1.5',
  }));

  /* -------------------------------------------------------------- bands + rows */
  let slideIndex = 0;

  CONTENT.phases.forEach((phase, pi) => {
    const band = bands[pi];
    const el = document.createElement('div');
    el.className = 'node band';
    el.style.cssText = `left:${SLIDE_X}px; top:${band.top}px; width:${BAND_W}px; height:${band.h}px;`;
    el.innerHTML = `
      <div style="display:flex; align-items:baseline; gap:12px;">
        <div class="left" style="flex:1"><span>${phase.tag} · ${phase.range}</span>${phase.title}</div>
        <div class="bridge">${phase.bridge}</div>
      </div>`;
    nodes.appendChild(el);

    phase.slides.forEach((slide) => {
      const box = slideBoxes[slideIndex];
      const cardH = 96;                      // content height, centred in the row
      const cardTop = box.top + (box.h - cardH) / 2;
      const slideEl = document.createElement('div');
      slideEl.className = 'node slide';
      slideEl.style.cssText = `left:${SLIDE_X}px; top:${cardTop}px; width:${SLIDE_W}px; height:${cardH}px;`;
      slideEl.innerHTML = `
        <div class="row"><span class="num">${slide.no}</span><span class="time">${slide.time}</span></div>
        <h4>${slide.title}</h4>
        <p>${slide.note}</p>`;
      nodes.appendChild(slideEl);

      // spine → slide
      const cy = cardTop + cardH / 2;
      wires.appendChild(svg('path', {
        d: `M${SPINE_X} ${cy} H${SLIDE_X - 1}`,
        fill: 'none', stroke: '#1F5C46', 'stroke-width': '1.5', 'marker-end': 'url(#jade-arrow)',
      }));

      // slide → mini bus → each leaf
      const leaves = leafBoxes.filter((l) => l.step && l.y >= box.top && l.y < box.top + box.h + 12);
      const busTop = Math.min(...leaves.map((l) => l.y + 12));
      const busBottom = Math.max(...leaves.map((l) => l.y + l.h - 12));
      wires.appendChild(svg('path', {
        d: `M${SLIDE_X + SLIDE_W} ${cy} H${BUS_X} V${busTop} M${BUS_X} ${busTop} V${busBottom}`,
        fill: 'none', stroke: 'rgba(23,33,27,0.30)', 'stroke-width': '1',
      }));

      leaves.forEach((leaf) => {
        const ly = leaf.y + leaf.h / 2;
        const isLimit = leaf.step.kind === 'limit';
        wires.appendChild(svg('path', {
          d: `M${BUS_X} ${ly} H${leaf.x - 2 }`,
          fill: 'none',
          stroke: isLimit ? '#9C6B1F' : 'rgba(23,33,27,0.30)',
          'stroke-width': '1',
          'marker-end': 'url(#ink-arrow)',
        }));

        const leafEl = document.createElement('div');
        leafEl.className = 'node leaf' + (isLimit ? ' limit' : '');
        leafEl.style.cssText = `left:${leaf.x}px; top:${leaf.y}px; width:${leaf.w}px; height:${leaf.h}px;`;
        leafEl.innerHTML = `<span class="rel">${leaf.step.rel}</span><p>${leaf.step.text}</p>`;
        nodes.appendChild(leafEl);
      });

      slideIndex += 1;
    });
  });

  /* ---------------------------------------- the limit bracket: 17 bounds 20 */
  const from17 = slideBoxes[3];
  const to20 = slideBoxes[6];
  const railX = W - 60;
  wires.appendChild(svg('path', {
    d: `M${railX} ${from17.top + from17.h / 2} V${to20.top + to20.h / 2}`,
    fill: 'none', stroke: '#9C6B1F', 'stroke-width': '1.5', 'stroke-dasharray': '6 5',
  }));
  [from17, to20].forEach((box) => {
    wires.appendChild(svg('path', {
      d: `M${LEAF_X + LEAF_W} ${box.top + box.h / 2} H${railX}`,
      fill: 'none', stroke: '#9C6B1F', 'stroke-width': '1', 'stroke-dasharray': '6 5',
    }));
  });
  wires.appendChild(svg('text', {
    x: railX + 18, y: (from17.top + to20.top + to20.h) / 2,
    transform: `rotate(-90 ${railX + 18} ${(from17.top + to20.top + to20.h) / 2})`,
    'text-anchor': 'middle',
    'font-family': 'ui-monospace, Consolas, monospace',
    'font-size': '9.5', fill: '#9C6B1F',
  }, 'limit — the evidence of 17 stops here'));

  /* --------------------------------------------------------------- legend */
  const legend = document.createElement('div');
  legend.className = 'node legend';
  legend.style.cssText = `left:${SLIDE_X}px; top:${LEGEND_Y}px; width:560px;`;
  legend.innerHTML = `
    <div class="row"><span class="swatch"></span><span>Progression — the spine, and a phase leading to its slides</span></div>
    <div class="row"><span class="swatch plain"></span><span>Branch — one step of that slide's reasoning, labelled with its role</span></div>
    <div class="row"><span class="swatch limit"></span><span>Limit — a later slide narrows an earlier claim</span></div>`;
  nodes.appendChild(legend);

  const handover = document.createElement('div');
  handover.className = 'node';
  handover.style.cssText = `left:${W - M - 240}px; top:${LEGEND_Y + 10}px; width:240px;`;
  handover.innerHTML = '<p class="handover">slide 22 → live demo</p>';
  nodes.appendChild(handover);

  /* ----------------------------------------------------------------- zoom */
  (function () {
    const viewport = document.getElementById('viewport');
    let scale = 1;

    function apply() {
      canvas.style.transform = `scale(${scale})`;
      canvas.style.height = H * scale + 'px';
    }

    function fit() {
      scale = Math.min(1, (viewport.clientWidth - 8) / W);
      apply();
    }

    document.getElementById('zoom-fit').addEventListener('click', fit);
    document.getElementById('zoom-in').addEventListener('click', () => {
      scale = Math.min(1.6, scale + 0.1);
      apply();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      scale = Math.max(0.25, scale - 0.1);
      apply();
    });
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
